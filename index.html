<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>anduimRSS - Lector de noticias</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header con logo -->
        <header>
            <div class="logo">
                <div class="logo-icon">📰</div>
                <div class="logo-text">
                    <h1>anduim<span class="gradient">RSS</span></h1>
                    <p>Tu agregador de noticias inteligente</p>
                </div>
            </div>
        </header>

        <!-- Formulario añadir fuente -->
        <div class="card add-card">
            <h3><span class="icon">➕</span> Añadir nueva fuente</h3>
            <div class="add-form">
                <input type="text" id="sourceName" placeholder="Nombre (ej: El Mundo)" class="input">
                <input type="url" id="sourceRss" placeholder="URL del RSS (ej: https://.../rss.xml)" class="input">
                <button id="addBtn" class="btn btn-primary">
                    <span class="btn-icon">+</span> Añadir fuente
                </button>
            </div>
        </div>

        <!-- Lista de fuentes -->
        <div class="card sources-card">
            <h3><span class="icon">📌</span> Mis fuentes</h3>
            <div id="sourcesList" class="sources-list"></div>
        </div>

        <!-- Barra de acciones -->
        <div class="actions-bar">
            <button id="refreshBtn" class="btn btn-success">
                <span class="btn-icon">🔄</span> Actualizar todas
            </button>
            <button id="markReadBtn" class="btn btn-secondary">
                <span class="btn-icon">✅</span> Marcar todo leído
            </button>
            <button id="clearReadBtn" class="btn btn-secondary">
                <span class="btn-icon">🗑️</span> Limpiar leídos
            </button>
        </div>

        <!-- Contenedor de noticias -->
        <div id="newsContainer" class="news-container">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <p>✨ Haz clic en "Actualizar todas" para cargar noticias</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
