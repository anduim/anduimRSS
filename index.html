<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketPulse</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--bg2:#13161e;--bg3:#1a1e2a;--border:#252a38;--accent:#d4a843;--accent2:#e8c96a;--text:#e8eaf0;--text2:#8b92a8;--text3:#555e78;--green:#34c98a;--red:#e05a5a;--radius:10px;--fh:'Playfair Display',serif;--fb:'Source Sans 3',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--fb);min-height:100vh}
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:100}
.logo{font-family:var(--fh);font-size:1.2rem;color:var(--accent);display:flex;align-items:center;gap:6px}
.logo span{color:var(--text)}
.hbtns{display:flex;gap:7px}
.hbtn{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-family:var(--fb);font-size:.78rem;font-weight:600;cursor:pointer;color:var(--text2);display:flex;align-items:center;gap:5px;transition:all .2s}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}
.hbtn.primary{background:var(--accent);color:#000;border-color:var(--accent)}
.hbtn.primary:hover{background:var(--accent2)}
.hbtn:disabled{opacity:.5;cursor:not-allowed}
@keyframes spin{to{transform:rotate(360deg)}}
.spin svg{animation:spin 1s linear infinite}
.feed{padding:16px;max-width:820px;margin:0 auto}
.feed-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.feed-hdr h2{font-family:var(--fh);font-size:1.05rem}
.feed-meta{font-size:.7rem;color:var(--text3)}
.src-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.src-chip{display:flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:.72rem;cursor:pointer;transition:all .15s}
.src-chip:hover{border-color:var(--red)}
.src-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.src-x{color:var(--text3);margin-left:3px}
.add-chip{background:var(--bg3);border:1px dashed var(--border);border-radius:20px;padding:4px 10px;font-size:.72rem;cursor:pointer;color:var(--text3);transition:all .15s}
.add-chip:hover{border-color:var(--accent);color:var(--accent)}
.filters{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.fchip{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:.74rem;cursor:pointer;color:var(--text2);white-space:nowrap;transition:all .15s}
.fchip:hover{border-color:var(--accent);color:var(--accent)}
.fchip.active{background:var(--accent);color:#000;border-color:var(--accent)}
.srch{position:relative;margin-bottom:12px}
.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3)}
#si{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px 8px 34px;color:var(--text);font-family:var(--fb);font-size:.83rem;outline:none;transition:border-color .2s}
#si:focus{border-color:var(--accent)}
#si::placeholder{color:var(--text3)}
.card{display:flex;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;transition:border-color .2s,box-shadow .2s;animation:fadeUp .3s ease forwards;opacity:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card:hover{border-color:var(--accent);box-shadow:-2px 0 0 var(--accent)}
.thumb{width:82px;height:62px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.thumb-ph{width:82px;height:62px;border-radius:6px;background:var(--bg3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.cbody{flex:1;min-width:0}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.65rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:4px}
.badge-dot{width:4px;height:4px;border-radius:50%}
.ctitle{font-size:.85rem;font-weight:600;line-height:1.35;color:var(--text);margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-decoration:none}
.ctitle:hover{color:var(--accent)}
.cdesc{font-size:.73rem;color:var(--text2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
.cfooter{display:flex;align-items:center;gap:6px}
.ctime{font-size:.67rem;color:var(--text3)}
.cacts{display:flex;gap:4px;margin-left:auto}
.abtn{background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:3px 7px;cursor:pointer;color:var(--text2);font-size:.67rem;font-family:var(--fb);display:flex;align-items:center;gap:3px;transition:all .15s;text-decoration:none;white-space:nowrap}
.abtn:hover{background:var(--accent);color:#000;border-color:var(--accent)}
.abtn.sv{color:var(--accent);border-color:var(--accent)}
.sw{position:relative}
.smenu{position:absolute;bottom:calc(100% + 4px);right:0;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:5px;min-width:150px;z-index:60;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.smenu.open{display:block}
.sopt{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:5px;cursor:pointer;font-size:.75rem;color:var(--text2);transition:all .15s;text-decoration:none}
.sopt:hover{background:var(--bg3);color:var(--text)}
.loading,.empty{text-align:center;padding:50px 20px;color:var(--text3)}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-top-left-radius:16px;border-top-right-radius:16px;padding:22px 18px 36px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.mhandle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal h3{font-family:var(--fh);font-size:1.1rem;margin-bottom:5px}
.msub{font-size:.76rem;color:var(--text2);margin-bottom:16px;line-height:1.5}
.msr{position:relative;margin-bottom:10px}
.msr svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3)}
.msr input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px 10px 38px;color:var(--text);font-family:var(--fb);font-size:.88rem;outline:none;transition:border-color .2s}
.msr input:focus{border-color:var(--accent)}
.msr input::placeholder{color:var(--text3)}
.mres{background:var(--bg3);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:10px;display:none;max-height:240px;overflow-y:auto}
.mres.show{display:block}
.mri{padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}
.mri:last-child{border-bottom:none}
.mri:hover{background:var(--bg2)}
.mri-top{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.mri-name{font-size:.84rem;font-weight:600;color:var(--text)}
.mri-tag{margin-left:auto;font-size:.63rem;background:rgba(212,168,67,.2);color:var(--accent);padding:2px 7px;border-radius:10px;font-weight:700}
.mri-url{font-size:.67rem;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mmsg{font-size:.75rem;padding:12px;text-align:center;color:var(--text3)}
.mdiv{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--text3);font-size:.72rem}
.mdiv::before,.mdiv::after{content:'';flex:1;height:1px;background:var(--border)}
.mlbl{display:block;font-size:.73rem;font-weight:600;color:var(--text2);margin-bottom:4px;margin-top:10px}
.minp{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:var(--fb);font-size:.83rem;outline:none;transition:border-color .2s}
.minp:focus{border-color:var(--accent)}
.minp::placeholder{color:var(--text3)}
.mbts{display:flex;gap:8px;margin-top:14px}
.mbtn{flex:1;padding:10px;border-radius:7px;font-family:var(--fb);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s;border:1px solid var(--border);background:var(--bg3);color:var(--text2)}
.mbtn:hover{border-color:var(--text2);color:var(--text)}
.mbtn.ok{background:var(--accent);color:#000;border-color:var(--accent)}
.mbtn.ok:hover{background:var(--accent2)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#000;padding:9px 18px;border-radius:20px;font-size:.8rem;font-weight:700;z-index:999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<header>
  <div class="logo">📈 <span>Market</span>Pulse</div>
  <div class="hbtns">
    <button class="hbtn" id="btn-add" onclick="openModal()">➕ Añadir</button>
    <button class="hbtn primary" id="btn-ref" onclick="loadAll()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
      Actualizar
    </button>
  </div>
</header>

<div class="feed">
  <div class="feed-hdr">
    <h2 id="feed-title">Todas las noticias</h2>
    <div class="feed-meta" id="feed-meta">0 noticias</div>
  </div>
  <div class="src-chips" id="src-chips"></div>
  <div class="filters">
    <div class="fchip active" onclick="setF('all',this)">📰 Todas</div>
    <div class="fchip" onclick="setF('bolsa',this)">📊 Bolsa</div>
    <div class="fchip" onclick="setF('macro',this)">🏦 Macro</div>
    <div class="fchip" onclick="setF('empresa',this)">🏢 Empresas</div>
    <div class="fchip" onclick="setF('saved',this)">🔖 Guardadas</div>
  </div>
  <div class="srch">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="si" placeholder="Buscar noticias..." oninput="doSearch(this.value)">
  </div>
  <div id="fb"></div>
</div>

<div class="overlay" id="ov" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="mhandle"></div>
    <h3>Añadir fuente</h3>
    <p class="msub">Escribe el nombre del medio y selecciona de la lista. También puedes pegar una URL RSS directamente.</p>
    <div class="msr">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="mq" placeholder="Bloomberg, Reuters, Expansión…" oninput="onQ(this.value)" autocomplete="off">
    </div>
    <div class="mres" id="mres"></div>
    <div class="mdiv">o introduce URL directamente</div>
    <label class="mlbl">URL del feed RSS</label>
    <input type="url" class="minp" id="mu" placeholder="https://ejemplo.com/feed.xml">
    <label class="mlbl">Nombre</label>
    <input type="text" class="minp" id="mn" placeholder="Nombre del medio">
    <div class="mbts">
      <button class="mbtn" onclick="closeModal()">Cancelar</button>
      <button class="mbtn ok" onclick="addManual()">Añadir URL</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── FUENTES — todas usan rss2json.com con Google News como fuente ──────────────
// rss2json actúa como proxy y devuelve JSON limpio sin problemas de CSP ni CORS
const KNOWN = [
  {n:'El Economista',     e:'📰',c:'#e05a5a',t:['bolsa','macro','empresa'],
   u:'https://news.google.com/rss/search?q=when:24h+allinurl:eleconomista.es&hl=es&gl=ES&ceid=ES:es'},
  {n:'Expansión',         e:'💼',c:'#d4a843',t:['bolsa','empresa'],
   u:'https://news.google.com/rss/search?q=when:24h+allinurl:expansion.com&hl=es&gl=ES&ceid=ES:es'},
  {n:'Cinco Días',        e:'📊',c:'#4a9edd',t:['macro','empresa'],
   u:'https://news.google.com/rss/search?q=when:24h+allinurl:cincodias.elpais.com&hl=es&gl=ES&ceid=ES:es'},
  {n:'El Confidencial',   e:'🔵',c:'#3b82f6',t:['bolsa','macro'],
   u:'https://news.google.com/rss/search?q=when:24h+allinurl:elconfidencial.com+mercados&hl=es&gl=ES&ceid=ES:es'},
  {n:'El País Economía',  e:'🗞',c:'#6366f1',t:['macro','empresa'],
   u:'https://news.google.com/rss/search?q=when:24h+allinurl:elpais.com+economia&hl=es&gl=ES&ceid=ES:es'},
  {n:'Bolsamanía',        e:'📈',c:'#22c55e',t:['bolsa'],
   u:'https://news.google.com/rss/search?q=when:24h+allinurl:bolsamania.com&hl=es&gl=ES&ceid=ES:es'},
  {n:'Invertia',          e:'🔍',c:'#a855f7',t:['bolsa','empresa'],
   u:'https://news.google.com/rss/search?q=when:24h+allinurl:invertia.com&hl=es&gl=ES&ceid=ES:es'},
  {n:'Reuters',           e:'📡',c:'#fb923c',t:['macro','empresa'],
   u:'https://news.google.com/rss/search?q=when:24h+allinurl:reuters.com&hl=es&gl=ES&ceid=ES:es'},
  {n:'Bloomberg',         e:'🌐',c:'#f97316',t:['macro','bolsa'],
   u:'https://news.google.com/rss/search?q=when:24h+allinurl:bloomberg.com&hl=es&gl=ES&ceid=ES:es'},
  {n:'Financial Times',   e:'🗞',c:'#e8c96a',t:['macro','empresa'],
   u:'https://news.google.com/rss/search?q=when:24h+allinurl:ft.com+finance&hl=en&gl=US&ceid=US:en'},
  {n:'MarketWatch',       e:'⚡',c:'#a3e635',t:['bolsa','macro'],
   u:'https://news.google.com/rss/search?q=when:24h+allinurl:marketwatch.com&hl=en&gl=US&ceid=US:en'},
  {n:'CNBC',              e:'📺',c:'#0ea5e9',t:['bolsa','macro'],
   u:'https://news.google.com/rss/search?q=when:24h+allinurl:cnbc.com+markets&hl=en&gl=US&ceid=US:en'},
  {n:'Yahoo Finance',     e:'💹',c:'#6d28d9',t:['bolsa','macro'],
   u:'https://news.google.com/rss/search?q=when:24h+allinurl:finance.yahoo.com&hl=en&gl=US&ceid=US:en'},
  {n:'Seeking Alpha',     e:'🔎',c:'#67e8f9',t:['bolsa','empresa'],
   u:'https://news.google.com/rss/search?q=when:24h+allinurl:seekingalpha.com&hl=en&gl=US&ceid=US:en'},
  {n:'Wall Street Journal',e:'📓',c:'#b45309',t:['bolsa','macro'],
   u:'https://news.google.com/rss/search?q=when:24h+allinurl:wsj.com&hl=en&gl=US&ceid=US:en'},
  {n:'The Economist',     e:'🎩',c:'#dc2626',t:['macro'],
   u:'https://news.google.com/rss/search?q=when:24h+allinurl:economist.com&hl=en&gl=US&ceid=US:en'},
  {n:'Investing.com',     e:'📈',c:'#34c98a',t:['bolsa','macro'],
   u:'https://news.google.com/rss/search?q=when:24h+allinurl:investing.com&hl=es&gl=ES&ceid=ES:es'},
  {n:'Forbes',            e:'🏆',c:'#eab308',t:['empresa','macro'],
   u:'https://news.google.com/rss/search?q=when:24h+allinurl:forbes.com+finance&hl=en&gl=US&ceid=US:en'},
  {n:'Morningstar',       e:'⭐',c:'#f59e0b',t:['bolsa','empresa'],
   u:'https://news.google.com/rss/search?q=when:24h+allinurl:morningstar.com&hl=en&gl=US&ceid=US:en'},
];

// ── ESTADO ──────────────────────────────────────────────────────────────────
var SRCS  = JSON.parse(localStorage.getItem('mp4_s') || '[]');
var SAVED = JSON.parse(localStorage.getItem('mp4_sv') || '[]');
var NEWS  = [];
var FILT  = [];
var AF    = 'all';
var SQ    = '';
var QT    = null;
var MAX   = 150;

// ── INIT ─────────────────────────────────────────────────────────────────────
window.onload = function() {
  renderChips();
  renderNews([]);
  if (SRCS.length) loadAll();
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.sw'))
      document.querySelectorAll('.smenu.open').forEach(function(m){ m.classList.remove('open'); });
  });
};

// ── FETCH CON TIMEOUT MANUAL (sin AbortSignal.timeout) ───────────────────────
function fetchTimeout(url, ms) {
  return new Promise(function(resolve, reject) {
    var ctrl = new AbortController();
    var tid = setTimeout(function(){ ctrl.abort(); reject(new Error('timeout')); }, ms);
    fetch(url, { signal: ctrl.signal })
      .then(function(r){ clearTimeout(tid); resolve(r); })
      .catch(function(e){ clearTimeout(tid); reject(e); });
  });
}

// ── CARGA DE FEEDS ────────────────────────────────────────────────────────────
// Usamos SOLO rss2json.com — devuelve JSON puro, sin XML, sin eval, sin CORS
function rss2jsonUrl(feedUrl) {
  return 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feedUrl) + '&count=30&api_key=';
}

function loadAll() {
  if (!SRCS.length) { renderNews([]); return; }
  var btn = document.getElementById('btn-ref');
  btn.classList.add('spin'); btn.disabled = true;
  document.getElementById('fb').innerHTML = '<div class="loading"><div class="spinner"></div><p>Cargando noticias...</p></div>';

  var promises = SRCS.map(function(s){ return fetchOne(s); });

  Promise.all(promises).then(function(results) {
    NEWS = [];
    var ok = 0;
    results.forEach(function(items, i) {
      if (items && items.length) { NEWS = NEWS.concat(items); ok++; }
    });
    NEWS.sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
    if (NEWS.length > MAX) NEWS = NEWS.slice(0, MAX);

    var now = new Date().toLocaleTimeString('es-ES', {hour:'2-digit',minute:'2-digit'});
    document.getElementById('feed-meta').textContent = NEWS.length + ' noticias · ' + now;
    btn.classList.remove('spin'); btn.disabled = false;
    applyF();
    showToast(NEWS.length
      ? '✓ ' + NEWS.length + ' noticias de ' + ok + '/' + SRCS.length + ' fuentes'
      : '⚠ Sin noticias. Comprueba tu conexión.');
  });
}

function fetchOne(src) {
  var url = rss2jsonUrl(src.u);
  return fetchTimeout(url, 15000)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data || data.status !== 'ok' || !data.items || !data.items.length) return [];
      return data.items.map(function(item) { return normItem(item, src); });
    })
    .catch(function(err) {
      console.warn('Error en ' + src.n + ':', err.message);
      return [];
    });
}

function normItem(item, src) {
  var title = (item.title || '').replace(/\s+-\s+[\w\s,\.]+$/, '').trim();
  var desc   = stripHtml(item.description || item.content || '').slice(0, 180);
  var thumb  = item.thumbnail || (item.enclosure && item.enclosure.link) || null;
  var id     = simpleHash(src.id + (item.link || title));
  return {
    id: id, title: title, desc: desc,
    link: item.link || '#',
    thumb: thumb,
    date: item.pubDate || new Date().toISOString(),
    sn: src.n, si: src.id, sc: src.c, se: src.e, st: src.t
  };
}

function stripHtml(h) {
  var tmp = document.createElement('div');
  tmp.innerHTML = h;
  return tmp.textContent || tmp.innerText || '';
}

function simpleHash(str) {
  var h = 0;
  for (var i = 0; i < str.length; i++) {
    h = ((h << 5) - h) + str.charCodeAt(i);
    h = h & h;
  }
  return Math.abs(h).toString(36);
}

// ── FILTROS ───────────────────────────────────────────────────────────────────
function setF(f, el) {
  AF = f; SQ = ''; document.getElementById('si').value = '';
  document.querySelectorAll('.fchip').forEach(function(e){ e.classList.remove('active'); });
  el.classList.add('active');
  applyF();
}
function doSearch(q) { SQ = q.toLowerCase(); applyF(); }
function applyF() {
  var n = NEWS.slice();
  if (AF === 'saved') n = n.filter(function(x){ return SAVED.includes(x.id); });
  else if (AF !== 'all') n = n.filter(function(x){ return x.st && x.st.includes(AF); });
  if (SQ) n = n.filter(function(x){
    return x.title.toLowerCase().includes(SQ) || x.desc.toLowerCase().includes(SQ);
  });
  FILT = n;
  var titles = {all:'Todas las noticias',bolsa:'Bolsa y mercados',macro:'Macroeconomía',empresa:'Empresas',saved:'Guardadas'};
  document.getElementById('feed-title').textContent = titles[AF] || 'Todas';
  document.getElementById('feed-meta').textContent = n.length + ' noticias';
  renderNews(n);
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderNews(news) {
  var fb = document.getElementById('fb');
  if (!SRCS.length) {
    fb.innerHTML = '<div class="empty"><p style="font-size:2.5rem;margin-bottom:12px">📰</p><p style="font-size:.9rem;color:var(--text2);margin-bottom:8px">Sin fuentes configuradas</p><p style="font-size:.78rem">Pulsa <b style="color:var(--accent)">➕ Añadir</b> para empezar</p></div>';
    return;
  }
  if (!news.length) {
    fb.innerHTML = '<div class="empty"><p style="font-size:1.8rem">🔍</p><p style="margin-top:8px;font-size:.85rem">Sin resultados</p></div>';
    return;
  }
  var html = '';
  for (var i = 0; i < news.length; i++) html += cardHTML(news[i], i);
  fb.innerHTML = html;
}

function cardHTML(n, i) {
  var sv  = SAVED.includes(n.id);
  var enc = encodeURIComponent;
  var del = Math.min(i * 20, 200);
  var thumb = n.thumb
    ? '<img class="thumb" src="' + esc(n.thumb) + '" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">' +
      '<div class="thumb-ph" style="display:none">' + n.se + '</div>'
    : '<div class="thumb-ph">' + n.se + '</div>';
  return '<div class="card" style="animation-delay:' + del + 'ms">' +
    thumb +
    '<div class="cbody">' +
      '<div class="badge" style="color:' + n.sc + '">' +
        '<span class="badge-dot" style="background:' + n.sc + '"></span>' + n.sn +
      '</div>' +
      '<a class="ctitle" href="' + esc(n.link) + '" target="_blank" rel="noopener">' + n.title + '</a>' +
      (n.desc ? '<div class="cdesc">' + n.desc + '</div>' : '') +
      '<div class="cfooter">' +
        '<span class="ctime">' + relTime(n.date) + '</span>' +
        '<div class="cacts">' +
          '<button class="abtn' + (sv?' sv':'') + '" onclick="toggleSave(\'' + n.id + '\',this)">' + (sv?'🔖':'📌') + '</button>' +
          '<a class="abtn" href="' + esc(n.link) + '" target="_blank" rel="noopener">🔗 Leer</a>' +
          '<div class="sw">' +
            '<button class="abtn" onclick="toggleShare(this)">↗</button>' +
            '<div class="smenu">' +
              '<a class="sopt" href="https://wa.me/?text=' + enc(n.title+' '+n.link) + '" target="_blank"><span>📱</span>WhatsApp</a>' +
              '<a class="sopt" href="https://t.me/share/url?url=' + enc(n.link) + '&text=' + enc(n.title) + '" target="_blank"><span>✈️</span>Telegram</a>' +
              '<a class="sopt" href="https://twitter.com/intent/tweet?text=' + enc(n.title) + '&url=' + enc(n.link) + '" target="_blank"><span>𝕏</span>Twitter/X</a>' +
              '<a class="sopt" href="https://www.linkedin.com/sharing/share-offsite/?url=' + enc(n.link) + '" target="_blank"><span>💼</span>LinkedIn</a>' +
              '<div class="sopt" onclick="copyLink(\'' + esc(n.link) + '\')"><span>📋</span>Copiar enlace</div>' +
              '<a class="sopt" href="mailto:?subject=' + enc(n.title) + '&body=' + enc(n.link) + '"><span>📧</span>Email</a>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// ── CHIPS ──────────────────────────────────────────────────────────────────────
function renderChips() {
  var html = SRCS.map(function(s) {
    return '<div class="src-chip" onclick="removeSource(\'' + s.id + '\')" title="Eliminar ' + s.n + '">' +
      '<span class="src-dot" style="background:' + s.c + '"></span>' +
      '<span>' + s.e + ' ' + s.n + '</span>' +
      '<span class="src-x">✕</span>' +
    '</div>';
  }).join('');
  html += '<div class="add-chip" onclick="openModal()">➕ Añadir fuente</div>';
  document.getElementById('src-chips').innerHTML = html;
}

function removeSource(id) {
  var src = SRCS.find(function(s){ return s.id === id; });
  if (!src) return;
  if (!confirm('¿Eliminar "' + src.n + '"?')) return;
  SRCS = SRCS.filter(function(s){ return s.id !== id; });
  NEWS = NEWS.filter(function(n){ return n.si !== id; });
  saveSrcs(); renderChips(); applyF();
  showToast('"' + src.n + '" eliminada');
}

// ── BÚSQUEDA EN MODAL ──────────────────────────────────────────────────────────
function onQ(val) {
  clearTimeout(QT);
  var q = val.trim().toLowerCase();
  var res = document.getElementById('mres');
  if (!q) { res.classList.remove('show'); res.innerHTML = ''; return; }
  var matches = KNOWN.filter(function(f) {
    return (f.n.toLowerCase().includes(q) || f.t.some(function(t){ return t.includes(q); }))
      && !SRCS.find(function(s){ return s.u === f.u; });
  });
  if (matches.length) {
    showMResults(matches);
  } else {
    res.classList.add('show');
    res.innerHTML = '<div class="mmsg">Generando feed para "' + val + '"...</div>';
    QT = setTimeout(function(){ buildAuto(val); }, 500);
  }
}

function showMResults(feeds) {
  var res = document.getElementById('mres');
  res._f = feeds;
  res.classList.add('show');
  res.innerHTML = feeds.map(function(f, i) {
    return '<div class="mri" onclick="selFeed(' + i + ')">' +
      '<div class="mri-top">' +
        '<span>' + f.e + '</span>' +
        '<span class="mri-name">' + f.n + '</span>' +
        '<span class="mri-tag">' + (f.t[0]||'') + '</span>' +
      '</div>' +
      '<div class="mri-url">Google News · ' + f.n + '</div>' +
    '</div>';
  }).join('');
}

function selFeed(i) {
  var f = document.getElementById('mres')._f;
  if (!f || !f[i]) return;
  addFeed(f[i]);
  closeModal();
}

function buildAuto(query) {
  var slug = query.toLowerCase().replace(/\s+/g,'');
  var feeds = [
    {n: query.charAt(0).toUpperCase()+query.slice(1), e:'📰', c:'#d4a843',
     t:['bolsa','macro','empresa'],
     u:'https://news.google.com/rss/search?q=when:24h+allinurl:' + encodeURIComponent(slug) + '.com&hl=es&gl=ES&ceid=ES:es'},
    {n: query.charAt(0).toUpperCase()+query.slice(1) + ' (todas)', e:'🔍', c:'#8b92a8',
     t:['bolsa','macro','empresa'],
     u:'https://news.google.com/rss/search?q=when:24h+' + encodeURIComponent(query) + '&hl=es&gl=ES&ceid=ES:es'},
  ].filter(function(f){ return !SRCS.find(function(s){ return s.u===f.u; }); });
  showMResults(feeds);
}

// ── AÑADIR FUENTE ──────────────────────────────────────────────────────────────
function addFeed(f) {
  if (SRCS.find(function(s){ return s.u === f.u; })) { showToast('Ya está añadida'); return; }
  var id = 's' + Date.now();
  SRCS.push({id:id, n:f.n, u:f.u, e:f.e||'📰', c:f.c||'#d4a843', t:f.t||['bolsa','macro','empresa']});
  saveSrcs(); renderChips();
  showToast('✓ "' + f.n + '" añadida');
}

function addManual() {
  var url  = document.getElementById('mu').value.trim();
  var name = document.getElementById('mn').value.trim();
  if (!url || !name) { showToast('⚠ URL y nombre obligatorios'); return; }
  addFeed({n:name, u:url, e:'📰', c:'#d4a843', t:['bolsa','macro','empresa']});
  closeModal();
}

function saveSrcs() { localStorage.setItem('mp4_s', JSON.stringify(SRCS)); }

// ── GUARDAR ────────────────────────────────────────────────────────────────────
function toggleSave(id, btn) {
  var i = SAVED.indexOf(id);
  if (i === -1) { SAVED.push(id); btn.innerHTML='🔖'; btn.classList.add('sv'); showToast('Guardada 🔖'); }
  else          { SAVED.splice(i,1); btn.innerHTML='📌'; btn.classList.remove('sv'); showToast('Eliminada'); }
  localStorage.setItem('mp4_sv', JSON.stringify(SAVED));
}

// ── MODAL ──────────────────────────────────────────────────────────────────────
function openModal() {
  document.getElementById('ov').classList.add('open');
  document.getElementById('mq').value = '';
  document.getElementById('mres').classList.remove('show');
  document.getElementById('mres').innerHTML = '';
  setTimeout(function(){ document.getElementById('mq').focus(); }, 200);
}
function closeModal() { document.getElementById('ov').classList.remove('open'); }

// ── COMPARTIR ──────────────────────────────────────────────────────────────────
function toggleShare(btn) {
  var m = btn.nextElementSibling;
  var was = m.classList.contains('open');
  document.querySelectorAll('.smenu.open').forEach(function(x){ x.classList.remove('open'); });
  if (!was) m.classList.add('open');
}
function copyLink(url) {
  navigator.clipboard.writeText(url).then(function(){ showToast('Enlace copiado ✓'); });
  document.querySelectorAll('.smenu.open').forEach(function(m){ m.classList.remove('open'); });
}

// ── UTILS ──────────────────────────────────────────────────────────────────────
function relTime(d) {
  var s = (Date.now() - new Date(d)) / 1000;
  if (isNaN(s)||s<0) return '';
  if (s<60)    return 'Ahora';
  if (s<3600)  return 'Hace ' + Math.floor(s/60) + 'm';
  if (s<86400) return 'Hace ' + Math.floor(s/3600) + 'h';
  return 'Hace ' + Math.floor(s/86400) + 'd';
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
